[chopper_tune]
debug: False                                                                   ; Enable debug output
inset: 10                                                                      ; Offset from axis limits (mm), to determine work area limits
current_change_step: 25                                                        ; Set run_current change step
measure_time: 1250                                                             ; Set measure time (msec)
required_rpm: 37.5,150,1.5                                                     ; Set range, step of motor rpm in find vibr mode
delay: 500                                                                     ; Set delay between measurements (msec) in find vibr mode
# fclk: 12                                                                     ; Override the driver clock (MHz), by default it is selected per driver
plateau_tolerance: 0.05                                                        ; Progressive search: treat results within this ratio as equal and use the value the datasheet favors
min_chopper_frequency: 22                                                      ; Progressive search: skip TOFF values with a lower estimated chopper frequency (kHz), as they can whine
